<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let value = +prompt("Nhập số");
      let array = [-3, 5, 1, 3, 2, 10];
      let index = -1;
      if (!isNaN(value)) {
        for (let i = 0; i < array.length; i++) {
          if (value == array[i]) {
            index = i;
          }
        }
        if (index > -1) {
          alert("số " + value + " nằm ở vị trí " + index + " trong mảng");
        } else {
          alert("Không tìm thấy trong mảng");
        }
      } else {
        alert("invalid input");
      }
    </script>
  </body>
</html>
