<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let array = [-3, 5, 1, 3, 2, 10];
        let max = array[0];
        let index = 0;
        for(i=1;i<array.length;i++){
            if(max<array[i]){
                max = array[i];
                index = i;
            }
        }
        alert("Số lớn nhất trong mảng là "+max+" ở vị trí "+index);
    </script>
</body>
</html>
