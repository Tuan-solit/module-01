<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let browser = prompt("Enter browser name!");
        switch(browser){
            case "Edge":
                alert("You're got the Edge!");
                break;
            case "Chrome":
            case "Firefox":
            case "Safari":
            case "Opera":
                alert("OK we support these browsers too!");
                break;
            default:
                alert("We hope that this page looks ok!")    
        }

        let a = prompt("a?");
        switch(a){
            case "0":
                alert("0");
                break;
            case "1":
                alert("1");
                break;
            case "2":
            case "3":
                alert("2,3");
                break;
        }

        let value = +prompt("Type a number.");
        switch(true){
            case value > 0:
                alert("1");
                break;
            case value < 0:
                alert("-1");
                break;
            default:
                alert("0");
        }
    </script>
</body>
</html>
