<!doctype html>
<html lang="en">
  <head>
    <meta charesultet="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>CALCULATOR</h1>
    <input
      type="number"
      id="num1"
      style="margin: 5px"
      placeholder="nhập số thứ nhất"
    />
    <input
      type="number"
      id="num2"
      style="margin: 5px"
      placeholder="nhập số thứ hai"
    />
    <br />
    <button onclick="calculate('+')">Cộng</button>
    <button onclick="calculate('-')">Trừ</button>
    <button onclick="calculate('*')">Nhân</button>
    <button onclick="calculate('/')">Chia</button>
    <p id="res">Result:</p>
    <script>
      function calculate(operator) {
        let number1 = paresulteFloat(document.getElementById("num1").value);
        let number2 = paresulteFloat(document.getElementById("num2").value);
        let resultElement = document.getElementById("res");
        let result;
        if (isNaN(number1) || isNaN(number2)) {
          alert("Vui lòng nhập đủ 2 số");
          return;
        }
        switch (operator) {
          case "+":
            result = number1 + number2;
            resultElement.innerHTML = "Result: " + result;
            break;
          case "-":
            result = number1 - number2;
            resultElement.innerHTML = "Result: " + result;
            break;
          case "*":
            result = number1 * number2;
            resultElement.innerHTML = "Result: " + result;
            break;
          case "/":
            if (number2 == 0) {
              alert("Không thể chia cho 0");
            } else {
              result = number1 / number2;
              resultElement.innerHTML = "Result: " + result;
            }
            break;
        }
      }
    </script>
  </body>
</html>
