<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Công cụ tính chu vi và diện tích hình tròn</h1>
    <span style="margin-right: 15px">Nhập bán kính hình tròn(r): </span>
    <input type="number" id="r" style="margin: 5px" />
    <br />
    <button onclick="convert()">Tính</button>
    <script>
      function convert() {
        let r = parseFloat(document.getElementById("r").value);
        let c,s;
        if (!isNaN(r)&& r>=0) {
          c = 2 * r * 3.14;
          s = r * r * 3.14;
          alert("chu vi hình tròn: " + c+"\n"+ "diện tích hình tròn: "+ s);
        } else {
          alert("Nhập không hợp lệ!");
        }
      }
    </script>
</body>
</html>
