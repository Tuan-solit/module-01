<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Nhập điểm số cho học sinh</h1>
    <span style="margin-right: 15px">Vật lý: </span>
    <input type="number" id="phy" style="margin: 5px" />
    <br />
    <span>Hóa học: </span>
    <input type="number" id="che" style="margin: 5px" />
    <br />
    <span>Sinh học: </span>
    <input type="number" id="bio" style="margin: 5px" />
    <br />
    <button onclick="calculate()">Nhập điểm</button>
    <script>
      function calculate() {
        let physic = parseFloat(document.getElementById("phy").value);
        let chemistry = parseFloat(document.getElementById("che").value);
        let biology = parseFloat(document.getElementById("bio").value);
        if (
          !isNaN(physic) &&
          !isNaN(chemistry) &&
          !isNaN(biology) &&
          10 >= physic &&
          physic >= 0 &&
          10 >= chemistry &&
          chemistry >= 0 &&
          10 >= biology &&
          biology >= 0
        ) {
          let average = (physic + chemistry + biology) / 3;
          let sum = physic + chemistry + biology;
          alert("Điểm trung bình: " + average + "\n" + "Tổng điểm: " + sum);
        } else {
          alert("Nhập không hợp lệ");
        }
      }
    </script>
  </body>
</html>
