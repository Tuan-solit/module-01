<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let doC = parseFloat(prompt("Nhập độ C"));
      if (!isNaN(doC)) {
        let doF = (9 * doC) / 5 + 32;
        alert(doC + " độ C = " + doF + " độ F");
      } else {
        alert("Invalid input");
      }
    </script>
  </body>
</html>
