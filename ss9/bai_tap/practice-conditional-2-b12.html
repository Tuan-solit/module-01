<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let vay = parseInt(prompt("Nhập số tiền "));
      let thang = parseInt(prompt("Nhập số tháng cho vay"));
      let laiSuat = parseFloat(prompt("Nhập lãi suất hàng tháng"));
      if (
        !isNaN(vay) &&
        !isNaN(thang) &&
        !isNaN(laiSuat) &&
        vay > 0 &&
        thang > 0 &&
        laiSuat > 0
      ) {
        let tongTien = vay * (1 + laiSuat) ** thang;
        alert("Tổng số tiền cuối cùng là " + tongTien);
      } else {
        alert("Invalid input");
      }
    </script>
  </body>
</html>
