<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let met = parseFloat(prompt("Nhập mét"));
      if (!isNaN(met)) {
        let feet = met * 3.2808;
        alert(met + " mét = " + feet + " feet");
      } else {
        alert("Invalid input");
      }
    </script>
  </body>
</html>
