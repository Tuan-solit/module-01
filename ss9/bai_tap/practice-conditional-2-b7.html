<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = parseFloat(prompt("Nhập a"));
        let b = parseFloat(prompt("Nhập b"));
        let c = parseFloat(prompt("Nhập c"));
        let delta,
          x1,
          x2 = 0;
        if (!isNaN(a) && !isNaN(b) && !isNaN(c)) {
          if (a != 0) {
            if (b % 2 != 0) {
              delta = b * b - a * c;
              if (delta > 0) {
                x1 = (-b + Math.sqrt(delta)) / a;
                x2 = (-b - Math.sqrt(delta)) / a;
                alert(
                  "Phương trình " +
                    a +
                    "x^2 + " +
                    b +
                    "x + " +
                    c +
                    " = 0 có 2 nghiệm phân biệt là " +
                    "\n" +
                    "x1 = " +
                    x1 +
                    "\n" +
                    "x2 = " +
                    x2,
                );
              } else if (delta == 0) {
                x1 = x2 = -b / a;
                alert(
                  "Phương trình " +
                    a +
                    "x^2 + " +
                    b +
                    "x + " +
                    c +
                    " = 0 có nghiệm kép là x1=x2= " +
                    x1,
                );
              } else {
                alert("Phương trình vô nghiệm");
              }
            } else {
              delta = b * b - 4 * a * c;
              if (delta > 0) {
                x1 = (-b + Math.sqrt(delta)) / (2 * a);
                x2 = (-b - Math.sqrt(delta)) / (2 * a);
                alert(
                  "Phương trình " +
                    a +
                    "x^2 + " +
                    b +
                    "x + " +
                    c +
                    " = 0 có 2 nghiệm phân biệt là " +
                    "\n" +
                    "x1 = " +
                    x1 +
                    "\n" +
                    "x2 = " +
                    x2,
                );
              } else if (delta == 0) {
                x1 = x2 = -b / (2 * a);
                alert(
                  "Phương trình " +
                    a +
                    "x^2 + " +
                    b +
                    "x + " +
                    c +
                    " = 0 có nghiệm kép là x1=x2= " +
                    x1,
                );
              } else {
                alert("Phương trình vô nghiệm");
              }
            }
          } else {
            alert("a phải khác 0");
          }
        }else{
            alert("Invalid input");
        }
    </script>
</body>
</html>
