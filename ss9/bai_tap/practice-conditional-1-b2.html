<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let age = parseInt(prompt("Enter age"));
      if (!isNaN(age) && age > 0) {
        if (age >= 18) {
          alert("Quá tuổi để vào lớp 10");
        } else if (age >= 15) {
          alert("Đủ điều kiện vào lớp 10");
        } else {
          alert("Chưa đủ tuổi để vào lớp 10");
        }
      }
    </script>
  </body>
</html>
