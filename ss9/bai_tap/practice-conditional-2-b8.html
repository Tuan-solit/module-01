<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let age = parseInt(prompt("Nhập tuổi"));
      if (!isNaN(age) && age > 0 && age < 120) {
        alert(age + " là tuổi của 1 người");
      } else {
        alert("Không phải là tuổi của 1 người");
      }
    </script>
  </body>
</html>
