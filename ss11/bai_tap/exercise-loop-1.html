<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      do {
        var num = parseInt(
          prompt(
            "Chọn chức năng" +
              "\n" +
              "1.Thêm" +
              "\n" +
              "2.Sửa" +
              "\n" +
              "3.Xóa" +
              "\n" +
              "4.Thoát chương trình",
          ),
        );
        switch (num) {
          case 1:
            alert("Chức năng thêm");
            break;
          case 2:
            alert("Chức năng sửa");
            break;
          case 3:
            alert("Chức năng xóa");
            break;
          case 4:
            break;
        }
      } while (num < 4);
    </script>
  </body>
</html>
