    <script>
        let n = +prompt("Nhập nhiệt độ");
        while(n<20||n>100){
            if(n<20){
                n = +prompt("tăng nhiệt độ lên");
            }else{
                n = +prompt("giảm nhiệt độ xuống");
            }
        }
    </script>
