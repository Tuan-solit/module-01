<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let count2 = 0;
      let n = 2;
      while (count2 < 20) {
        let count1 = 0;
        for (let i = 1; i <= n; i++) {
          if (n % i == 0) {
            count1++;
          }
        }
        if (count1 == 2) {
          count2++;
          document.write(n + "<br>");
        }
        n++;
      }
    </script>
  </body>
</html>
