<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let a = 0;
      let b = 1;
      let count = 0,
        sum = 0;
      while (count < 25) {
        document.write(a + "<br>");
        sum += a;
        let next = a + b;
        a = b;
        b = next;
        count++;
      }
      document.write("sum = " + sum);
    </script>
  </body>
</html>
