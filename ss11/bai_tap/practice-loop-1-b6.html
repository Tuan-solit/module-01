<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let i = 0;
      let count = 0,
        sum = 0;
      while (count < 30) {
        if (i % 7 == 0) {
          document.write(i + "<br>");
          sum += i;
          count++;
        }
        i++;
      }
      document.write("sum = " + sum);
    </script>
  </body>
</html>
