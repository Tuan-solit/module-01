<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = 0;
        let b = 1;
        let count = 0;
        while(count<20){
            let next = a + b;
            a = b;
            b = next;
            count ++;
            if(next%5==0){
                count = 20;
                document.write(next);
            }
        }
    </script>
</body>
</html>
