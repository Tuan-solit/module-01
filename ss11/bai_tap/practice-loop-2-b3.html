<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      for (let i = 1; i < 6; i++) {
        let dot = "";
        for (let j = 1; j <= i; j++) {
          dot += "*";
        }
        document.write(dot + "<br>");
      }
      document.write("====================" + "<br>");
      for (let i = 5; i >= 1; i--) {
        let dot = "";
        for (let j = 1; j <= i; j++) {
          dot += "*";
        }
        document.write(dot + "<br>");
      }
      document.write("====================" + "<br>");
      for (let i = 0; i < 5; i++) {
        for (let j = 1; j < 6; j++) {
          if (j < 5 - i) {
            document.write("&ensp;");
          } else {
            document.write("*");
          }
        }
        document.write("<br>");
      }
      document.write("====================" + "<br>");
      for (let i = 0; i < 5; i++) {
        for (let j = 1; j < 6; j++) {
          if (j <= i) {
            document.write("&ensp;");
          } else {
            document.write("*");
          }
        }
        document.write("<br>");
      }
    </script>
  </body>
</html>
