<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for(let i =0;i<5;i++){
            for(let j =0;j<20;j++){
                if(i==0||i==4||j==0||j==19){
                    document.write("*");
                }else{
                    document.write("&ensp;");
                }
            }
            document.write("<br>");
        }
    </script>
