<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function checkString(arr, e) {
        let count = 0;
        for (let i = 0; i < arr.length; i++) {
          if (arr[i] == e) {
            count++;
          }
        }
        if (count == 0) {
          return (count = -1);
        }
        return count;
      }
      let n = +prompt("Nhập số lượng phần tử");
      let array = new Array(n);
      for (let i = 0; i < n; i++) {
        array[i] = prompt("Nhập phần tử thứ: " + i);
      }
      let input = prompt("Nhập ký tự");
      alert(checkString(array, input));
    </script>
  </body>
</html>
