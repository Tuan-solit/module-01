<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function compareNumber(a, b) {
        if (a < b) {
          return alert(a + b);
        } else if (a > b) {
          alert(a + " lớn hơn " + b);
        } else {
          alert(a + " bằng " + b);
        }
      }
      let a = +prompt("Nhập a");
      let b = +prompt("Nhập b");
      compareNumber(a, b);
    </script>
  </body>
</html>
