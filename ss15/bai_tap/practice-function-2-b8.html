<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function reverse(arr) {
        let first=0;
        let last=arr.length-1;
        while(first<last){
            let c = arr[first];
            arr[first] = arr[last];
            arr[last] = c;
            first++;
            last--;
        }
      }
      let array = [1,2,4,6,7,9];
      reverse(array);
      alert(array);
    </script>
  </body>
</html>
