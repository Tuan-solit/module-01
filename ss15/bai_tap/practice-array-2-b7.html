<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function swap(a, b) {
        if (a % 1 == 0 && b % 1 == 0) {
          let c = a;
          a = b;
          b = c;
          alert("a = " + a);
          alert("b = " + b);
        } else {
          alert("Khong phai so nguyen");
        }
      }
      let a = +prompt("Nhap a");
      let b = +prompt("Nhap b");
      swap(a, b);
    </script>
  </body>
</html>
