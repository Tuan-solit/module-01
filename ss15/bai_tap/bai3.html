<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n= +prompt("Nhap so luong phan tu");
        let array = new Array(n);
        for(let i=0;i<array.length;i++){
            array[i]= +prompt("Nhap phan tu thu: "+i);
        }
        alert(array);
        let count1=0;
        let count2=0;
        for(let i=0;i<array.length-1;i++){
           let temp = array[i]-array[i+1];
           if(temp>0){
            count1++;
           }else if(temp<0){
            count2++;
           }
        }
        if(count1==(array.length-1)||count2==(array.length-1)){
            alert("mảng đã sort");
        }else{
            alert("mảng chưa sort");
        }
    </script>
</body>
</html>
