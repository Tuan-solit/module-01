<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function isPrime(number) {
        for (let i = 2; i < number; i++) {
          if (number % i == 0) {
            return false;
          }
          return true;
        }
      }
      let number = parseInt(prompt("Nhập số cần kiểm tra"));
      if (!isNaN(number) && number > 0) {
        if (isPrime(number)) {
          alert("La snt");
        } else {
          alert("Ko la snt");
        }
      } else {
        alert("invalid input");
      }
    </script>
  </body>
</html>
