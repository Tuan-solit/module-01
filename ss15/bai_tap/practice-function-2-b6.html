<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function isPositive(number) {
        if (number % 1 == 0 && number > 0) {
          return true;
        } else {
          return false;
        }
      }
      let a = +prompt("Nhap so");
      if (isPositive(a)) {
        alert("Ok");
      } else {
        alert("No");
      }
    </script>
  </body>
</html>
