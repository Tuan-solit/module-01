<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class Temperature{
            constructor(celsius){
                this.celsius=celsius;
            }
            convertToFahrenheit(){
                return this.celsius*1.8+32;
            }
            convertToKelvin(){
                return this.celsius+273.15;
            }
        }
        let temp = new Temperature(25);
        console.log("độ F là "+ temp.convertToFahrenheit()+"\n"+"độ K là "+ temp.convertToKelvin());
    </script>
</body>
</html>
