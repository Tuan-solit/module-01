<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caculate</title>
  </head>
  <body>
    <h1>Tính chu vi, diện tích hình chữ nhật</h1>
    <span>Nhập chiều dài</span>
    <input type="number" id="height"/>
    <span>Nhập chiều rộng</span>
    <input type="number" id="width"/> <br />
    <button onclick="caculate()">Tính</button>
    <script>
      function caculate() {
        let width = parseFloat(document.getElementById("width").value);
        let height = parseFloat(document.getElementById("height").value);
        if (isNaN(width) || isNaN(height) || width <= 0 || height <= 0) {
          alert("Nhập không hợp lệ");
          return;
        }
        let chuVi = (width + height) * 2;
        let dienTich = width * height;
        alert(
          "Chu vi hình chữ nhật là: " +
            chuVi +
            "\n" +
            "Diện tích hình chữ nhật là: " +
            dienTich,
        );
      }
    </script>
  </body>
</html>
