<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let input = prompt("Nhập 1 dãy 10 số");
      let array = input.split(",");
      let count = 0;
      if (array.length == 10) {
        for (let i = 0; i < array.length; i++) {
          if (array[i] >= 10) {
            count++;
          }
        }
        console.log(array);
        console.log("mảng có " + count + " số lớn hơn hoặc bằng 10");
      } else if (array.length < 10) {
        alert("chưa đủ 10 số");
      } else {
        alert("chỉ nhập 10 số thôi");
      }
    </script>
  </body>
</html>
