<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let str1 = "abc aaa ssss zzzz";
      let str2 = "cde fgh xyz qwer";
      let arr1 = str1.split(" ");
      let arr2 = str2.split(" ");
      let count = 0;
      if (arr1.length == arr2.length) {
        for (let i = 0; i < arr1.length; i++) {
          for (let j = 0; i < arr2.length; j++) {
            if (arr1[i] === arr2[j]) {
              count++;
            }
          }
        }
        if (count == arr1.length) {
          alert("2 chuoi giong nhau");
        } else {
          alert("2 chuoi khac nhau");
        }
      } else {
        alert("2 chuoi khac nhau");
      }
    </script>
  </body>
</html>
