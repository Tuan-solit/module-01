<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let input = prompt("Nhập 1 dãy số");
      let array = input.split(",");
      let first = 0;
      let last = array.length-1;
      while(first<last){
        let b = array[first];
        array[first] = array[last];
        array[last] = b;
        first++;
        last--;
      }
      document.write(array);
    </script>
  </body>
</html>
