<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let array = ["c", "s", "c", "2", "6", "1"];
      let first = 0;
      let last = array.length - 1;
      while (first < last) {
        let c = array[first];
        array[first] = array[last];
        array[last] = c;
        first++;
        last--;
      }
      console.log(array);
    </script>
  </body>
</html>
