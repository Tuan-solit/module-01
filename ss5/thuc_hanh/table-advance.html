<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table{
            border-collapse: collapse;
            width: 100%;         
        }
        th{
            background-color: red;
            color: white;
            padding: 20px;
            border: 1px solid white;
        }
        td{
            text-align: center;
            padding: 8px;
            border-left: 1px solid;
        }
        body{
            padding: 50px;
        }
    </style>
</head>
<body>
    <h1>Thoi khoa bieu</h1>
    <table border="1">
        <tr>
            <th rowspan="2">Thu</th>
            <th colspan="2">Hoat dong</th>
        </tr>
        <tr>
            <th>Sang</th>
            <th>Chieu</th>
        </tr>
        <tr>
            <td>Thu Hai</td>
            <td>The duc</td>
            <td>HD tro choi moi</td>
        </tr>
        <tr>
            <td>Thu 3</td>
            <td>Nhan biet tap noi</td>
            <td>Ren ne nep, ky nang song</td>
        </tr>
        <tr>
            <td>Thu 4</td>
            <td>Am nhac</td>
            <td>Vui choi</td>
        </tr>
        <tr>
            <td>Thu 5</td>
            <td>Van hoc</td>
            <td>Nhan biet cac gia tri song</td>
        </tr>

    </table>
</body>
</html>
