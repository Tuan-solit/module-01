<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YOUR HOBBY</title>
    <style>
      body {
        background-color: aqua;
      }
      form {
        border: 1px solid slategrey;
        margin: auto 400px;
        background-color: white;
      }
      table {
        margin: 0 auto;
      }
      th {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <form
      action="https://www.google.com/search"
      method="get"
      style="font-family: Arial, Helvetica, sans-serif"
    >
      <h1
        style="
          text-align: center;
          margin: 10px;
          background-color: orangered;
          color: white;
        "
      >
        Sở thích của bạn
      </h1>
      <table>
        <tr>
          <th>
            <p style="color: blue">Họ và tên:</p>
          </th>
          <td>
            <input type="text" name="name" size="20" />
          </td>
        </tr>
        <tr>
          <th>
            <p style="color: blue">Email:</p>
          </th>
          <td>
            <input type="text" name="email" size="17" />
          </td>
        </tr>
        <tr>
          <th>
            <span style="color: blue">Sở thích: </span>
          </th>
          <td>
            <table style="color: tomato">
              <tr>
                <td><input type="checkbox" />Thể thao</td>
                <td><input type="checkbox" />Âm nhạc</td>
                <td><input type="checkbox" />Đọc sách</td>
              </tr>
              <tr>
                <td><input type="checkbox" />Lướt web</td>
                <td><input type="checkbox" />Điện ảnh</td>
                <td><input type="checkbox" />Chơi game</td>
              </tr>
              <tr>
                <td><input type="checkbox" />Du lịch</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td></td>
          <td>
            <input type="submit" name="submit" value="Gửi thông tin" />
            <input type="reset" name="submit" value="Nhập lại" />
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
