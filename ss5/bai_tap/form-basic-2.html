<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <style>
      form {
        border: 1px;
        padding: 2px 10px;
        background-color: khaki;
        margin: auto 500px;
      }
    </style>
  </head>
  <body>
    <form action="#" method="post">
      <h2 style="margin-top: 10px; background-color: aquamarine; color: blue">
        ĐĂNG KÝ HỌC VIÊN
      </h2>
      <table>
        <tr>
          <td>
            <label for="name">Họ và tên</label>
          </td>
          <td>
            <input type="text" name="name" size="30" />
          </td>
        </tr>
        <tr>
          <td>
            <label for="date">Ngày sinh</label>
          </td>
          <td>
            <input type="date" name="date" size="18" />
          </td>
        </tr>
        <tr>
          <td>
            <label for="gender">Giới tính</label>
          </td>
          <td>
            <input type="radio" name="gender" value="male" />Nam
            <input type="radio" name="gender" value="female" />Nữ
          </td>
        </tr>
        <tr>
          <td>
            <label for="address">Địa chỉ</label>
          </td>
          <td>
            <textarea name="address" cols="25" rows="3"></textarea>
          </td>
        </tr>
        <tr>
          <td>
            <label>Lớp</label>
          </td>
          <td>
            <select name="class">
              <option>---Chọn lớp---</option>
              <option value="A">A1</option>
              <option value="B">B1</option>
              <option value="C">C2</option>
              <option value="D">D3</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>
            <label for="email">Email</label>
          </td>
          <td>
            <input type="email" name="email" />
          </td>
        </tr>
        <tr>
          <td>
            <label for="phone">Điện thoại</label>
          </td>
          <td>
            <input type="text" name="phone" maxlength="10" />
          </td>
        </tr>
        <tr>
          <td></td>
          <td>
            <button type="submit">Đăng ký</button>
            <button type="reset">Nhập lại</button>
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
