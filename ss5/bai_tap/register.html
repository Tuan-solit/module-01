<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
  </head>
  <body>
    <form
      action="http://demo.codegym.vn/6/registration_form/register.php"
      method="post"
    >
      <h2>Mô tả</h2>
      <p style="margin-bottom: 0px">Họ tên:</p>
      <input type="text" name="name" style="margin-top: 1px" />
      <p style="margin-bottom: 0px">Email:</p>
      <input type="text" name="email" style="margin-top: 1px" />
      <p style="margin-bottom: 0px">Số điện thoại:</p>
      <input type="text" name="phone" style="margin-top: 1px" />
      <p style="margin-bottom: 0px">Giới tính:</p>
      <input type="radio" name="gender" style="margin-top: 1px" checked />Nam
      <input type="radio" name="gender" style="margin-top: 1px" />Nữ
      <p>
        <input type="button" name="submit" value="Đăng ký" />
      </p>
    </form>
  </body>
</html>
