<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let num = +prompt("Nhap so");
      let sum = 0;
      let text = "";
      while(num != -1){
          text += num + "<br>";
          sum += num;
          num = +prompt("Nhap so");
      }
      document.write(text);
      document.write("Tổng các số đã nhập là "+ sum);

      let i = 1;
      while (i < 100) {
        document.write("<hr width = " + i + "%>");
        i++;
      }
    </script>
  </body>
</html>
